name: Route EGC into NEE Question 1

on:
  push:
    branches: [agent/route-egc-into-nee-q1]
    paths:
      - 'scripts/tmp_route_egc_into_nee_q1.py'
      - '.github/workflows/tmp-route-egc-into-nee-q1.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-egc-into-nee-q1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply routing update
        run: python scripts/tmp_route_egc_into_nee_q1.py
      - name: Run retained tests
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,reproducibility]'
          python -m pytest -q
      - name: Commit routing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Route EGC evidence into NEE Question 1"
          git push origin HEAD:agent/route-egc-into-nee-q1
